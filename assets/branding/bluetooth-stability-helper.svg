    <path d="M190 151c39-35 93-35 132 0"/>
    <path d="M214 179c25-22 59-22 84 0"/>
    <path d="M238 207c11-9 25-9 36 0"/>
  </g>
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M143 213v171l82-68-59-42 59-43-82-66v219zm35-116 42 34-42 30V97zm0 213 42 29-42 35v-64z" fill="none" stroke="url(#rogue)" stroke-width="20"/>
    <path d="M235 228h72l-41 50 52 43-36 43h-79l44-53-51-43 39-40z" fill="url(#metal)"/>
    <path d="M335 214v165M335 278h67M402 190v189" fill="none" stroke="#22dbe8" stroke-width="22"/>
  </g>
  <path d="M177 407h62l13-27 17 58 22-91 22 83 18-46 13 23h57" fill="none" stroke="#34e77b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>