<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Bluetooth Stability Helper BSH monogram</title>
  <desc id="desc">BSH monogram with wireless signal arcs and a stability pulse in the Rogue neon visual system.</desc>
  <defs>
    <linearGradient id="rogue" x1="76" y1="78" x2="430" y2="426" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9a46ff"/>
      <stop offset=".46" stop-color="#2d8cff"/>
      <stop offset="1" stop-color="#19e2ea"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbd3df"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="104" fill="#0f1116"/>
  <circle cx="256" cy="260" r="188" fill="none" stroke="url(#rogue)" stroke-width="13" stroke-linecap="round" stroke-dasharray="490 55" transform="rotate(-4 256 260)" opacity=".96"/>
