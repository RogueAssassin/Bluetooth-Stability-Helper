name: Package Module

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create install zip
        run: |
          cd module
          zip -r ../bt-stability-helper-${GITHUB_REF_NAME#v}.zip .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt-stability-helper
          path: bt-stability-helper-*.zip
