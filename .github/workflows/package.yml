name: Package Check
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module metadata
        run: |
          test -f module/module.prop
          grep -q '^version=0.7.0' module/module.prop
          grep -q '^versionCode=70' module/module.prop
          grep -q '^updateJson=' module/module.prop
      - name: Build test zip
        run: |
          cd module
          zip -r9 ../bt-stability-helper-test.zip . -x '*.git*'
          unzip -t ../bt-stability-helper-test.zip
