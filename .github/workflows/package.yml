name: Package Module

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'module/**'
      - '.github/workflows/package.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read module version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version=' module/module.prop | cut -d= -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip_name=bt-stability-helper-v${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Create Magisk install zip
        shell: bash
        run: |
          cd module
          zip -r -9 "../${{ steps.version.outputs.zip_name }}" .

      - name: Validate Magisk zip layout
        shell: bash
        run: |
          unzip -l "${{ steps.version.outputs.zip_name }}" | grep -q 'module.prop'
          unzip -l "${{ steps.version.outputs.zip_name }}" | grep -q 'service.sh'
          unzip -l "${{ steps.version.outputs.zip_name }}" | grep -q 'customize.sh'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt-stability-helper-v${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.zip_name }}
