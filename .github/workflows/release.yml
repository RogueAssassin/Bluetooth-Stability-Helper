name: Build Magisk Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v, for example 0.6.0'
        required: true
        default: '0.6.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "zip=bt-stability-helper-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Build module zip
        shell: bash
        run: |
          rm -f bt-stability-helper-*.zip
          zip -r "${{ steps.vars.outputs.zip }}" . \
            -x '.git/*' \
            -x '.github/*' \
            -x 'bt-stability-helper-*.zip'

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Bluetooth Stability Helper ${{ steps.vars.outputs.version }}
          files: ${{ steps.vars.outputs.zip }}
          generate_release_notes: true
