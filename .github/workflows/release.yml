name: Build and Release Module

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read module version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version=' module/module.prop | cut -d= -f2)
          VERSION_CODE=$(grep '^versionCode=' module/module.prop | cut -d= -f2)
          ZIP_NAME="bt-stability-helper-v${VERSION}.zip"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches module version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="v${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Tag $TAG does not match module version $EXPECTED"
            exit 1
          fi

      - name: Build install zip
        shell: bash
        run: |
          cd module
          zip -r "../${{ steps.version.outputs.zip_name }}" .

      - name: Validate zip layout
        shell: bash
        run: |
          unzip -l "${{ steps.version.outputs.zip_name }}"
          unzip -l "${{ steps.version.outputs.zip_name }}" | grep -q 'module.prop'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }} Release
          files: ${{ steps.version.outputs.zip_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
