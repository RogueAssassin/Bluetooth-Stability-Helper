name: Build and Release Module

on:
  push:
    branches:
      - main
    paths:
      - 'module/**'
      - 'companion-app/**'
      - 'tests/**'
      - 'update.json'
      - 'CHANGELOG.md'
      - '.github/workflows/release.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A push that does not change the module version (docs, CI, tests) must not
  # fail the pipeline or republish: release only when the version tag is new
  # or already points at this commit.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      release_needed: ${{ steps.check.outputs.release_needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check whether this version is already released
        id: check
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep '^version=' module/module.prop | cut -d= -f2)
          TAG="v${VERSION}"
          TAG_SHA=$(git ls-remote origin "refs/tags/${TAG}^{}" | cut -f1)
          [ -n "$TAG_SHA" ] || TAG_SHA=$(git ls-remote origin "refs/tags/${TAG}" | cut -f1)
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::${TAG} is already released at ${TAG_SHA}; skipping release. Bump module.prop and update.json to publish a new version."
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: gate
    if: needs.gate.outputs.release_needed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read module version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version=' module/module.prop | cut -d= -f2)
          VERSION_CODE=$(grep '^versionCode=' module/module.prop | cut -d= -f2)
          ZIP_NAME="bt-stability-helper-v${VERSION}.zip"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify update manifest matches module metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          props = {}
          for line in Path('module/module.prop').read_text().splitlines():
              if '=' in line and not line.strip().startswith('#'):
                  k, v = line.split('=', 1)
                  props[k.strip()] = v.strip()
          manifest = json.loads(Path('update.json').read_text())
          version = props['version']
          version_code = int(props['versionCode'])
          expected_zip = f'https://github.com/RogueAssassin/Bluetooth-Stability-Helper/releases/download/v{version}/bt-stability-helper-v{version}.zip'
          assert manifest['version'] == version, f"update.json version {manifest['version']} != module.prop {version}"
          assert int(manifest['versionCode']) == version_code, f"update.json versionCode {manifest['versionCode']} != module.prop {version_code}"
          assert manifest['zipUrl'] == expected_zip, f"update.json zipUrl mismatch: {manifest['zipUrl']} != {expected_zip}"
          assert 'updateJson=' in Path('module/module.prop').read_text(), 'module.prop missing updateJson'
          PY

      - name: Verify stable release version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          case "$VERSION" in
            *-testing|*-alpha*|*-beta*|*-rc*)
              echo "Refusing to publish prerelease version $VERSION from main"
              exit 1
              ;;
          esac

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find module -type f -name '*.sh' -print0)

      - name: Run module tests
        run: sh tests/run-tests.sh

      - name: Build & verify signed companion APK
        id: signing
        uses: ./.github/actions/build-signed-companion
        with:
          keystore-base64: ${{ secrets.BSH_SIGNING_KEYSTORE_BASE64 }}
          store-password: ${{ secrets.BSH_SIGNING_STORE_PASSWORD }}
          key-alias: ${{ secrets.BSH_SIGNING_KEY_ALIAS }}
          key-password: ${{ secrets.BSH_SIGNING_KEY_PASSWORD }}
          cert-sha256: ${{ secrets.BSH_SIGNING_CERT_SHA256 }}

      - name: Stage companion APK in module
        shell: bash
        run: |
          cp companion-app/app/build/outputs/apk/release/app-release.apk module/companion.apk
          test -s module/companion.apk

      - name: Build Magisk install zip
        shell: bash
        run: |
          cd module
          zip -r -9 "../${{ steps.version.outputs.zip_name }}" .

      - name: Validate Magisk zip layout
        shell: bash
        run: |
          unzip -l "${{ steps.version.outputs.zip_name }}"
          unzip -l "${{ steps.version.outputs.zip_name }}" | grep -q 'module.prop'
          unzip -l "${{ steps.version.outputs.zip_name }}" | grep -q 'service.sh'
          unzip -l "${{ steps.version.outputs.zip_name }}" | grep -q 'customize.sh'
          unzip -l "${{ steps.version.outputs.zip_name }}" | grep -q 'companion.apk'
          unzip -p "${{ steps.version.outputs.zip_name }}" module.prop | grep -q '^version=${{ steps.version.outputs.version }}$'
          unzip -p "${{ steps.version.outputs.zip_name }}" module.prop | grep -q '^versionCode=${{ steps.version.outputs.version_code }}$'
          unzip -p "${{ steps.version.outputs.zip_name }}" module.prop | grep -q '^updateJson='

      - name: Generate SHA-256 checksum
        shell: bash
        run: sha256sum "${{ steps.version.outputs.zip_name }}" > "${{ steps.version.outputs.zip_name }}.sha256"

      - name: Create version tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          git fetch --tags --force

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG already exists at $TAG_SHA and does not point to $GITHUB_SHA"
              exit 1
            fi
            echo "Tag $TAG already points to this commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "Bluetooth Stability Helper $TAG"
            git push origin "$TAG"
            echo "Created and pushed $TAG"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          name: Bluetooth Stability Helper v${{ steps.version.outputs.version }}
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ steps.version.outputs.zip_name }}
            ${{ steps.version.outputs.zip_name }}.sha256
            module/companion.apk
          generate_release_notes: true
          draft: false
          prerelease: false
