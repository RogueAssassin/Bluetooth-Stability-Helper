name: Build and Release Module

on:
  push:
    branches:
      - main
    paths:
      - 'module/**'
      - 'companion-app/**'
      - 'tests/**'
      - 'update.json'
      - 'CHANGELOG.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read module version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version=' module/module.prop | cut -d= -f2)
          VERSION_CODE=$(grep '^versionCode=' module/module.prop | cut -d= -f2)
          ZIP_NAME="bt-stability-helper-v${VERSION}.zip"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify update manifest matches module metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          props = {}
          for line in Path('module/module.prop').read_text().splitlines():
              if '=' in line and not line.strip().startswith('#'):
                  k, v = line.split('=', 1)
                  props[k.strip()] = v.strip()
          manifest = json.loads(Path('update.json').read_text())
          version = props['version']
          version_code = int(props['versionCode'])
          expected_zip = f'https://github.com/RogueAssassin/Bluetooth-Stability-Helper/releases/download/v{version}/bt-stability-helper-v{version}.zip'
          assert manifest['version'] == version, f"update.json version {manifest['version']} != module.prop {version}"
          assert int(manifest['versionCode']) == version_code, f"update.json versionCode {manifest['versionCode']} != module.prop {version_code}"
          assert manifest['zipUrl'] == expected_zip, f"update.json zipUrl mismatch: {manifest['zipUrl']} != {expected_zip}"
          assert 'updateJson=' in Path('module/module.prop').read_text(), 'module.prop missing updateJson'
          PY

      - name: Verify stable release version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          case "$VERSION" in
            *-testing|*-alpha*|*-beta*|*-rc*)
              echo "Refusing to publish prerelease version $VERSION from main"
              exit 1
              ;;
          esac

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find module -type f -name '*.sh' -print0)

      - name: Run module tests
        run: sh tests/run-tests.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore persistent BSH signing keystore
        shell: bash
        env:
          BSH_SIGNING_KEYSTORE_BASE64: ${{ secrets.BSH_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$BSH_SIGNING_KEYSTORE_BASE64" || { echo "Missing BSH_SIGNING_KEYSTORE_BASE64 repository secret"; exit 1; }
          printf '%s' "$BSH_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bsh-release.jks"
          test -s "$RUNNER_TEMP/bsh-release.jks"

      - name: Build signed companion APK
        working-directory: companion-app
        env:
          BSH_SIGNING_STORE_FILE: ${{ runner.temp }}/bsh-release.jks
          BSH_SIGNING_STORE_PASSWORD: ${{ secrets.BSH_SIGNING_STORE_PASSWORD }}
          BSH_SIGNING_KEY_ALIAS: ${{ secrets.BSH_SIGNING_KEY_ALIAS }}
          BSH_SIGNING_KEY_PASSWORD: ${{ secrets.BSH_SIGNING_KEY_PASSWORD }}
        run: |
          gradle :app:verifyBshSigningConfigured :app:assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK signing certificate
        id: signing
        shell: bash
        env:
          BSH_SIGNING_CERT_SHA256: ${{ secrets.BSH_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$BSH_SIGNING_CERT_SHA256" || { echo "Missing BSH_SIGNING_CERT_SHA256 repository secret"; exit 1; }
          ACTUAL=$(apksigner verify --print-certs companion-app/app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$BSH_SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          ACTUAL_NORM=$(printf '%s' "$ACTUAL" | tr -d ':[:space:]')
          test "$ACTUAL_NORM" = "$EXPECTED" || { echo "Signing certificate mismatch"; echo "Expected: $EXPECTED"; echo "Actual: $ACTUAL_NORM"; exit 1; }
          echo "sha256=$ACTUAL_NORM" >> "$GITHUB_OUTPUT"
          echo "Verified persistent BSH certificate: $ACTUAL_NORM"

      - name: Stage companion APK in module
        shell: bash
        run: |
          cp companion-app/app/build/outputs/apk/release/app-release.apk module/companion.apk
          test -s module/companion.apk

      - name: Build Magisk install zip
        shell: bash
        run: |
          cd module
          zip -r -9 "../${{ steps.version.outputs.zip_name }}" .

      - name: Validate Magisk zip layout
        shell: bash
        run: |
          unzip -l "${{ steps.version.outputs.zip_name }}"
          unzip -l "${{ steps.version.outputs.zip_name }}" | grep -q 'module.prop'
          unzip -l "${{ steps.version.outputs.zip_name }}" | grep -q 'service.sh'
          unzip -l "${{ steps.version.outputs.zip_name }}" | grep -q 'customize.sh'
          unzip -l "${{ steps.version.outputs.zip_name }}" | grep -q 'companion.apk'
          unzip -p "${{ steps.version.outputs.zip_name }}" module.prop | grep -q '^version=${{ steps.version.outputs.version }}$'
          unzip -p "${{ steps.version.outputs.zip_name }}" module.prop | grep -q '^versionCode=${{ steps.version.outputs.version_code }}$'
          unzip -p "${{ steps.version.outputs.zip_name }}" module.prop | grep -q '^updateJson='

      - name: Generate SHA-256 checksum
        shell: bash
        run: sha256sum "${{ steps.version.outputs.zip_name }}" > "${{ steps.version.outputs.zip_name }}.sha256"

      - name: Create version tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          git fetch --tags --force

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG already exists at $TAG_SHA and does not point to $GITHUB_SHA"
              exit 1
            fi
            echo "Tag $TAG already points to this commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "Bluetooth Stability Helper $TAG"
            git push origin "$TAG"
            echo "Created and pushed $TAG"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Bluetooth Stability Helper v${{ steps.version.outputs.version }}
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ steps.version.outputs.zip_name }}
            ${{ steps.version.outputs.zip_name }}.sha256
            module/companion.apk
          generate_release_notes: true
          draft: false
          prerelease: false
