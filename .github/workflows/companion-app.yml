name: Companion App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - testing
    paths:
      - 'companion-app/**'
      - '.github/workflows/companion-app.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: companion-app
        run: gradle :app:assembleDebug --stacktrace
      - name: Stage module companion payload
        shell: bash
        run: |
          cp companion-app/app/build/outputs/apk/debug/app-debug.apk module/companion.apk
          test -s module/companion.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bsh-companion-debug
          path: companion-app/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bsh-module-companion-payload
          path: module/companion.apk
